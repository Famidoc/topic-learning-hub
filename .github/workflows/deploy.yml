name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # 當代碼推送到 main 分支時觸發

permissions:
  contents: write # 確保 action 有權限寫入 gh-pages 分支

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # 要發布的資料夾
          branch: gh-pages # 要發布到的分支
          clean: true
